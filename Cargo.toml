[package]
name = "grav1synth"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rust-av/grav1synth"
description = "Grain Synth analyzer and editor for AV1 files"
keywords = ["video", "multimedia", "av1"]
categories = ["multimedia", "multimedia::video", "multimedia::encoding"]
exclude = ["/dav1d-test-data", "/tests"]

[lib]
name = "grav1synth"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.55"
arrayvec = "0.7.2"
av1-grain = { git = "https://github.com/LysanderdeJong/av1-grain.git", rev = "f615ca944afe6c7c93c028c7ce292e09233f1709" }
bit = "0.1.1"
bitvec = "1.0.1"
clap = { version = "4.0.2", features = ["derive"] }
crossterm = "0.29.0"
dialoguer = "0.12.0"
ffmpeg = { version = "6.0.0", default-features = false, features = [
    "format",
], package = "ffmpeg-the-third" }
indicatif = "0.18"
log = "0.4.17"
nom = "8.0.0"
num-rational = "0.4.1"
num-traits = "0.2.15"
num_enum = "0.7"
pretty_env_logger = "0.5.0"
rayon = "1.10.0"
v_frame_05 = { package = "v_frame", version = "0.5.1" }
video-resize = "0.2.0"

[dev-dependencies]
interpolate_name = "0.2.3"
quickcheck = "1.0.3"
quickcheck_macros = "1.0.0"
tempfile = "3.3.0"

[features]
default = []
ffmpeg_static = ["ffmpeg/static", "ffmpeg/build"]
unstable = ["av1-grain/unstable"]
profile-diff = []
dav1d_tests = []

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"

[profile.relwithdebug]
inherits = "release"
debug = "full"
